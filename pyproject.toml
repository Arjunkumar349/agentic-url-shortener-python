[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdlc-prototype"
version = "0.1.0"
description = "Governed agentic SDLC workflow prototype"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentic-sdlc = "agentic_sdlc.cli:main"

[tool.setuptools.packages.find]
include = ["agentic_sdlc*", "url_shortener*", "schemas*", "tests*"]

[tool.setuptools.package-data]
schemas = ["*.json"]